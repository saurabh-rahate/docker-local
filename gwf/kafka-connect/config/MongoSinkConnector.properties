name=mongo-sink-connector
connector.class=com.mongodb.kafka.connect.MongoSinkConnector
tasks.max=1

# Topics — comma separated
topics=sample_sink,topic2,topic3

# MongoDB connection
connection.uri=mongodb://mongos:27017/
database=gwfinn_db_local

# Default collection — fallback if no topic override
collection=DEFAULT_SINK_COLLECTION

# Write strategy — always insert, never upsert
writemodel.strategy=com.mongodb.kafka.connect.sink.writemodel.strategy.InsertOneDefaultStrategy

# Batch
max.batch.size=1000
bulk.write.ordered=false

# Converters
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Heartbeat
heartbeat.interval.ms=30000

# Topic to collection overrides
# Each topic can write to a different collection
# topic.override.sample_sink.collection=sample
topic.override.topic2.collection=collection2
topic.override.topic3.collection=collection3

# Error handling
errors.tolerance=all
errors.log.enable=true
errors.log.include.messages=true