version: "3.8"

services:

  # ─── Config Server ───────────────────────────────────────
  mongo-configsvr:
    image: bitnami/mongodb:8.0
    container_name: mongo-configsvr
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rsConfig
      MONGODB_ADVERTISED_HOSTNAME: mongo-configsvr
      MONGODB_PORT_NUMBER: "27019"
      MONGODB_EXTRA_FLAGS: "--configsvr"
    ports:
      - "27019:27019"
    volumes:
      - configsvr_data:/bitnami/mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Shard 1 ─────────────────────────────────────────────
  mongo-shard1:
    image: bitnami/mongodb:8.0
    container_name: mongo-shard1
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rsShard1
      MONGODB_ADVERTISED_HOSTNAME: mongo-shard1
      MONGODB_PORT_NUMBER: "27018"
      MONGODB_EXTRA_FLAGS: "--shardsvr"
    ports:
      - "27018:27018"
    volumes:
      - shard1_data:/bitnami/mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Mongos Router ───────────────────────────────────────
  mongos:
    image: bitnami/mongodb:8.0
    container_name: mongos
    restart: always
    entrypoint: []
    command: >
      bash -c "
        mongos --configdb rsConfig/mongo-configsvr:27019
               --bind_ip_all
               --port 27017
      "
    ports:
      - "27017:27017"
    depends_on:
      mongo-configsvr:
        condition: service_healthy
      mongo-shard1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Cluster Init ──────────────────────────────────────
  mongo-cluster-init:
    image: bitnami/mongodb:8.0
    container_name: mongo-cluster-init
    restart: "no"
    depends_on:
      mongos:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mongosh --host mongos --port 27017 --eval \"
          sh.addShard('rsShard1/mongo-shard1:27018');
          sh.enableSharding('gwfinn_db_local');
        \"
      "

  # ─── Mongo Express ───────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongos:27017/
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      mongos:
        condition: service_healthy

  # ─── Kafka ───────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── Kafka UI ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: kafka-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Kafka Connect ────────────────────────────────────────
  kafka-connect:
    image: confluentinc/cp-kafka-connect:latest
    container_name: kafka-connect
    restart: always
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: kafka-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/kafka-connect/jars
    volumes:
      - ./kafka-connect/jars:/kafka-connect/jars
      - ./kafka-connect/config:/kafka-connect/config
    command:
      - /bin/bash
      - -c
      - |
        echo "Waiting for Kafka to be ready..."
        cub kafka-ready -b kafka:29092 1 60
        echo "Kafka is ready, starting Connect..."
        connect-standalone \
          /kafka-connect/config/connect-standalone.properties \
          /kafka-connect/config/MongoSourceConnector.properties \
          /kafka-connect/config/MongoSinkConnector.properties
    depends_on:
      kafka:
        condition: service_healthy
      mongo-cluster-init:
        condition: service_completed_successfully

volumes:
  configsvr_data:
  shard1_data:
  kafka_data: